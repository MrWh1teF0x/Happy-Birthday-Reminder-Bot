[project]
name = "happy-birthday-reminder-bot"
version = "0.1.0"
description = "Телеграм-бот для уведомлений о днях рождения за неделю"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MrWh1teF0x" }
]
keywords = ["telegram", "bot", "birthday", "reminder"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
]

dependencies = [
    # Telegram Bot framework (async, современный API)
    "aiogram>=3.13,<4.0",
    # Планировщик для ежедневной проверки дней рождения
    "apscheduler>=3.10",
    # БД для хранения людей и дат рождения
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    # Настройки и валидация конфига (.env -> BOT_TOKEN и т.д.)
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # Удобная работа с датами (парсинг "12.05.2000", расчет "за неделю")
    "python-dateutil>=2.8",
    "alembic>=1.20.0",
    "emoji>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.5",
]

[project.scripts]
bot = "src.main:run"
run = "src.main:run"
test = "src.dev.tasks:test"
lint = "src.dev.tasks:lint"
fmt = "src.dev.tasks:fmt"
fmt-check = "src.dev.tasks:fmt_check"
typecheck = "src.dev.tasks:typecheck"
check = "src.dev.tasks:check"
precommit = "src.dev.tasks:precommit"
install-hooks = "src.dev.tasks:install_hooks"
migrate = "src.dev.tasks:migrate"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
show_error_codes = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
